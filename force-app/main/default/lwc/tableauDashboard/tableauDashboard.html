<template>
    <lightning-card title={cardTitle} icon-name="custom:custom63">
        <template lwc:if={hasError}>
            <div class="slds-p-around_medium slds-text-color_error" role="alert">
                {errorMessage}
            </div>
        </template>
        <template lwc:elseif={embedUrl}>
            <div class="tableau-container" style={containerStyle}>
                <iframe
                    title={cardTitle}
                    src={embedUrl}
                    class="tableau-frame"
                    frameborder="0"
                    allowfullscreen
                ></iframe>
            </div>
        </template>
    </lightning-card>
</template>
